settings:
  host: 127.0.0.1
  port: 8000
  database_path: /data/gateway.sqlite3
  provider_timeout_seconds: 45
  max_body_bytes: 1048576
  retention_days: 30

models:
  fast:
    enabled: false
    providers:
      - name: replace-with-provider-name
        model: REPLACE_WITH_VERIFIED_MODEL_ID
        api_base: https://provider.example.invalid/v1
        api_key_env: PROVIDER_API_KEY
        enabled: false
        # Public providers must use HTTPS on port 443. Blocked ranges (metadata, link-local,
        # multicast, and similar) are refused even when listed here.
        # For an internal provider only, list the exact networks it resolves to. This also
        # allows plain HTTP and a non-443 port for that provider, so use it deliberately:
        # trusted_internal_networks: ["10.20.0.0/16"]
        # api_base: http://10.20.0.15:8080/v1
      # Add one fallback provider only after checking its actual compatibility,
      # endpoint, model ID, API key variable, and data-sharing implications.

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-gateway-v1:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8000
      - GATEWAY_CONFIG=/app/config/config.yaml
      - GATEWAY_DATABASE_PATH=/data/gateway.sqlite3
      - GATEWAY_PEPPER=${GATEWAY_PEPPER}
    volumes:
      - ai-gateway-v1-data:/data
      - ./config/config.yaml:/app/config/config.yaml:ro
    tmpfs:
      - /tmp:mode=1777,size=64M
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - gateway_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request, sys; port = os.environ.get('GATEWAY_PORT', '8000'); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{port}/healthz', timeout=3).getcode() == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
          pids: 100

networks:
  gateway_internal:
    driver: bridge
    internal: false

volumes:
  ai-gateway-v1-data:
    name: ai-gateway-v1-data
